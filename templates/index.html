<!DOCTYPE html>
<html>
<head>
  <title>Steam Stats Lookup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {margin: 0; padding: 0; box-sizing: border-box;}
    body {font-family: 'Inter', sans-serif; background: #0a0a0a; color: #f5f5f5; }

    /* Search bar (before results) */
    .search-bar {position: fixed; top: 0; left: 0; right: 0;
      display: flex; gap: 10px; padding: 12px 20px;
      background: rgba(10,10,10,0.85); backdrop-filter: blur(10px);
      z-index: 100;
      flex-wrap:wrap;
    }
    .search-bar input {
      flex: 1; max-width: 280px; min-width: 120px; padding: 8px 12px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; border-radius: 6px; font-family: 'Inter'; font-size: 0.9rem;
    }
    .search-bar button {
      padding: 8px 16px; background: #f5f5f0; color: #0a0a0a;
      border: none; border-radius: 6px; font-weight: 500; cursor: pointer;
      font-size: 0.9rem; flex-shrink: 0;
    }

    /*Player Profile */
    .hero {
      min-height: 100vh; position: relative;
      display: flex; flex-direction: column; justify-content: flex-start;
      padding-top: 30%;
      background-size: cover; background-position: center;
    }   
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.75) 100%);
      backdrop-filter: blur(6px);
    }
    .hero-content {
      position: relative; z-index: 2; padding: 0 6vw; width: 100%;
    }
    .hero-name {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: clamp(4rem, 14vw, 11rem);
      line-height: 0.9;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }
    .hero-sub {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.3rem;
      margin-top: 20px;
      color: rgba(245,245,240,0.85);
    }
    .hero-scroll {
      position: relative; z-index: 2; padding: 0 6vw;
      margin-top: 60px;
      font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(245,245,240,0.7);
      display: flex; align-items: center; gap: 10px;
    }
    .hero-scroll::after {
      content: ''; width: 1px; height: 30px; background: rgba(245,245,240,0.5);
      animation: scrollpulse 2s ease-in-out infinite;
    }
    @keyframes scrollpulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }

    /* --- Games section --- */
    .games-section { padding: 100px 6vw; max-width: 1000px; margin: 0 auto; }
    .games-heading {
      font-family: 'Playfair Display', serif; font-size: 2.2rem;
      margin-bottom: 60px; text-align: center;
    }
    .game-card {
      display: flex; align-items: center; gap: 30px;
      padding: 30px 0; border-bottom: 1px solid rgba(245,245,240,0.15);
      opacity: 0; transform: translateY(50px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .game-card.visible { opacity: 1; transform: translateY(0); }
    .game-card img { width: 140px; border-radius: 6px; flex-shrink: 0; }
    .game-rank {
      font-family: 'Playfair Display', serif; font-size: 2.5rem;
      color: rgba(245,245,240,0.3); width: 60px; flex-shrink: 0;
    }
    .game-info { flex: 1; }
    .game-info h3 { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 400; }
    .game-info p { color: rgba(245,245,240,0.6); margin-top: 6px; }

    .empty-state { text-align: center; padding: 200px 20px; color: rgba(245,245,240,0.5); }

  </style>
</head>
<body>

  <div class="search-bar">
    <input type="text" id="steamid-input" placeholder="Enter a SteamID64">
    <button id="lookup-btn">Look up</button>
  </div>

  <div id="app">
    <div class="empty-state">
      <p>Enter a SteamID above to generate a dashboard.</p>
    </div>
  </div>

  <script>
    const button = document.getElementById("lookup-btn");
    const input = document.getElementById("steamid-input");
    const app = document.getElementById("app");

    button.addEventListener("click", async () => {
      const steamid = input.value.trim();
      if (!steamid) return;

      app.innerHTML = `<div class="empty-state"><p>Loading...</p></div>`;

      try {
        const response = await fetch(`/api/stats/${steamid}`);
        const data = await response.json();

        if (data.error) {
          app.innerHTML = `<div class="empty-state"><p>${data.error}</p></div>`;
          return;
        }

        renderDashboard(data);
      } catch (err) {
        app.innerHTML = `<div class="empty-state"><p>Something went wrong: ${err.message}</p></div>`;
      }
    });

    function renderDashboard(data) {
      let html = `
        <div class="hero" style="background-image: url('${data.player.avatar}')">
          <div class="hero-content">
            <div class="hero-name">${data.player.name}</div>
            <div class="hero-sub">Steam Dashboard</div>
          </div>
          <div class="hero-scroll">Scroll</div>
        </div>

        <div class="games-section">
          <div class="games-heading">Top Games</div>
      `;

      data.top_games.forEach((game, i) => {
        html += `
          <div class="game-card">
            <div class="game-rank">${String(i + 1).padStart(2, '0')}</div>
            <div class="game-info">
              <h3>${game.name}</h3>
              <p>${game.playtime_hours} hours played</p>
            </div>
          </div>
        `;
      });

      html += `</div>`;
      app.innerHTML = html;

      // Scroll-reveal each card, add "visible" when it enters the viewport
      const cards = document.querySelectorAll(".game-card");
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
          }
        });
      }, { threshold: 0.2 });

      cards.forEach(card => observer.observe(card));
    }
  </script>
</body>
</html>
